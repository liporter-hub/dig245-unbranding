<!doctype html>
<html lang="en">
<head>
    <!-- meta tags, links to css, etc. -->
    <meta charset="utf-8">
    <title>Unbranding</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <!-- visible content goes here -->
	
    <img id="main-image" src="assets/img/FB.png">
    <p id="button">Create Account</p>
    <div>
    <img id="meta" src="assets/img/meta.png"></div>
    <script>
        const btn = document.getElementById('button');
        const mainImg = document.getElementById('main-image');
        const originalSrc = mainImg.src;
        const hoverSrc = 'assets/img/Eye.png';

        btn.addEventListener('mouseenter', () => {
            mainImg.src = hoverSrc;
        });

        btn.addEventListener('mouseleave', () => {
            mainImg.src = originalSrc;
        });
    </script>
</body>
</html>
